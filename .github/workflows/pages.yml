name: Publier le site (GitHub Pages)

# Publie la version navigateur (le même fichier que Plume.html) comme site : https://<compte>.github.io/Plume/
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/build.js
      - name: Préparer le site
        run: |
          mkdir site
          cp dist-web/Plume.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
