<div id="app">

  <!-- Barre d'onglets : les boutons Réduire / Agrandir / Fermer de Windows se placent à droite, dans cette même barre -->
  <header id="tabstrip">
    <div id="tabs" role="tablist" aria-label="Documents ouverts">
      <button type="button" class="tab tab-home active" id="tab-home" role="tab" title="Accueil" aria-label="Accueil"><svg class="ic"><use href="#i-home"/></svg></button>
    </div>
    <button type="button" id="tab-new" title="Nouveau document (Ctrl+T)" aria-label="Nouveau document"><svg class="ic"><use href="#i-plus"/></svg></button>
    <div id="drag-fill"></div>
  </header>

  <main id="views">

    <!-- ===== Accueil ===== -->
    <section id="home" aria-label="Accueil">
      <div id="home-scroll">
        <header class="home-head">
          <div class="home-brand"><span class="brand-tile"><svg class="ic"><use href="#i-feather"/></svg></span><span>Plume</span></div>
          <label class="home-search"><svg class="ic"><use href="#i-search"/></svg><input id="home-q" type="search" placeholder="Rechercher dans vos documents récents" autocomplete="off" spellcheck="false" aria-label="Rechercher"></label>
          <button type="button" class="avatar-btn" data-profile title="Compte et paramètres" aria-label="Compte et paramètres"><span class="avatar">?</span></button>
        </header>

        <section class="tpl-band">
          <div class="tpl-inner">
            <div class="tpl-head">
              <h2>Commencer un nouveau document</h2>
              <button type="button" id="tpl-toggle" class="flat">Galerie de modèles <svg class="ic sm"><use href="#i-chev-down"/></svg></button>
            </div>
            <div id="tpl-grid" class="tpl-grid collapsed"></div>
          </div>
        </section>

        <section class="recent">
          <div class="recent-head">
            <h2>Documents récents</h2>
            <div class="recent-tools">
              <select id="home-sort" aria-label="Trier par">
                <option value="recent">Dernière ouverture</option>
                <option value="title">Titre (A à Z)</option>
              </select>
              <button type="button" id="home-view" class="icon-btn" title="Basculer entre grille et liste" aria-label="Basculer entre grille et liste"><svg class="ic"><use href="#i-rows"/></svg></button>
              <button type="button" id="home-open" class="icon-btn" title="Ouvrir un fichier (Ctrl+O)" aria-label="Ouvrir un fichier"><svg class="ic"><use href="#i-folder"/></svg></button>
            </div>
          </div>
          <div id="recent-list" class="grid"></div>
        </section>
      </div>
    </section>

    <!-- ===== Document ===== -->
    <section id="docview" hidden aria-label="Document">
      <div id="chrome">
        <div id="dochead">
          <button type="button" id="doc-logo" title="Retour à l'accueil" aria-label="Retour à l'accueil"><span class="brand-tile sm"><svg class="ic"><use href="#i-feather"/></svg></span></button>
          <nav id="menubar" role="menubar" aria-label="Menus"></nav>
          <div class="title-row">
            <input id="title" type="text" value="Sans titre" spellcheck="false" aria-label="Titre du document">
            <span id="savestate">Prêt</span>
          </div>
          <div class="head-right">
            <button type="button" id="btn-expand" class="icon-btn" title="Réafficher les menus et la barre d'outils (Ctrl+Maj+F)" aria-label="Réafficher les menus"><svg class="ic"><use href="#i-chev-down"/></svg></button>
            <button type="button" id="btn-history" class="icon-btn" title="Historique des versions" aria-label="Historique des versions"><svg class="ic"><use href="#i-history"/></svg></button>
            <button type="button" id="btn-comments" class="icon-btn" title="Commentaires" aria-label="Commentaires"><svg class="ic"><use href="#i-comment"/></svg></button>
            <button type="button" id="btn-save" class="pill-primary" title="Enregistrer (Ctrl+S)"><svg class="ic sm"><use href="#i-save"/></svg><span>Enregistrer</span></button>
            <button type="button" class="avatar-btn" data-profile title="Compte et paramètres" aria-label="Compte et paramètres"><span class="avatar">?</span></button>
          </div>
        </div>

        <div id="toolbar" role="toolbar" aria-label="Mise en forme">
          <div id="tb-tools">
            <div class="grp">
              <button type="button" data-cmd="undo" title="Annuler (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
              <button type="button" data-cmd="redo" title="Rétablir (Ctrl+Y)"><svg class="ic"><use href="#i-redo"/></svg></button>
              <button type="button" data-act="print" title="Imprimer (Ctrl+P)"><svg class="ic"><use href="#i-print"/></svg></button>
              <button type="button" data-act="spell" id="tb-spell" title="Correcteur orthographique"><svg class="ic"><use href="#i-spell"/></svg></button>
              <select id="tb-zoom" title="Zoom de la page" aria-label="Zoom">
                <option value="50">50 %</option><option value="75">75 %</option><option value="90">90 %</option>
                <option value="100" selected>100 %</option><option value="125">125 %</option><option value="150">150 %</option><option value="200">200 %</option>
              </select>
            </div>
            <div class="grp">
              <select id="tb-block" data-menu="block" title="Style de paragraphe" aria-label="Style de paragraphe">
                <option value="p">Texte normal</option>
                <option value="h1">Titre 1</option>
                <option value="h2">Titre 2</option>
                <option value="h3">Titre 3</option>
                <option value="blockquote">Citation</option>
              </select>
              <select id="tb-font" data-menu="font" title="Police" aria-label="Police">
                <option>Calibri</option><option>Arial</option><option>Times New Roman</option>
                <option>Georgia</option><option>Verdana</option><option>Segoe UI</option><option>Courier New</option>
              </select>
            </div>
            <div class="grp">
              <button type="button" data-size="-1" title="Réduire la taille de police" class="sz"><svg class="ic"><use href="#i-minus"/></svg></button>
              <input id="tb-size" type="text" inputmode="numeric" value="11" title="Taille de police (pt)" aria-label="Taille de police">
              <button type="button" data-size="1" title="Augmenter la taille de police" class="sz"><svg class="ic"><use href="#i-plus"/></svg></button>
            </div>
            <div class="grp">
              <button type="button" data-cmd="bold" title="Gras (Ctrl+B)"><svg class="ic"><use href="#i-bold"/></svg></button>
              <button type="button" data-cmd="italic" title="Italique (Ctrl+I)"><svg class="ic"><use href="#i-italic"/></svg></button>
              <button type="button" data-cmd="underline" title="Souligné (Ctrl+U)"><svg class="ic"><use href="#i-underline"/></svg></button>
              <button type="button" data-cmd="strikeThrough" title="Barré"><svg class="ic"><use href="#i-strike"/></svg></button>
              <label class="colorbtn" title="Couleur du texte"><svg class="ic"><use href="#i-color"/></svg><i id="ico-color"></i><input type="color" id="tb-color" value="#d93025"></label>
              <label class="colorbtn" title="Surlignage"><svg class="ic"><use href="#i-hilite"/></svg><i id="ico-hilite"></i><input type="color" id="tb-hilite" value="#fff475"></label>
            </div>
            <div class="grp">
              <button type="button" data-act="link" title="Insérer un lien (Ctrl+K)"><svg class="ic"><use href="#i-link"/></svg></button>
              <button type="button" data-act="comment" title="Ajouter un commentaire (Ctrl+Alt+M)"><svg class="ic"><use href="#i-comment"/></svg></button>
              <button type="button" data-act="image" title="Insérer une image"><svg class="ic"><use href="#i-image"/></svg></button>
              <button type="button" data-act="at" title="Puces intelligentes et blocs (ou tapez @)"><svg class="ic"><use href="#i-at"/></svg></button>
            </div>
            <div class="grp">
              <button type="button" data-cmd="justifyLeft" title="Aligner à gauche"><svg class="ic"><use href="#i-al-left"/></svg></button>
              <button type="button" data-cmd="justifyCenter" title="Centrer"><svg class="ic"><use href="#i-al-center"/></svg></button>
              <button type="button" data-cmd="justifyRight" title="Aligner à droite"><svg class="ic"><use href="#i-al-right"/></svg></button>
              <button type="button" data-cmd="justifyFull" title="Justifier"><svg class="ic"><use href="#i-al-justify"/></svg></button>
            </div>
            <div class="grp">
              <button type="button" data-cmd="insertUnorderedList" title="Liste à puces"><svg class="ic"><use href="#i-list-bullet"/></svg></button>
              <button type="button" data-cmd="insertOrderedList" title="Liste numérotée"><svg class="ic"><use href="#i-list-number"/></svg></button>
              <button type="button" data-act="checklist" title="Liste de tâches"><svg class="ic"><use href="#i-checklist"/></svg></button>
              <button type="button" data-cmd="outdent" title="Diminuer le retrait"><svg class="ic"><use href="#i-indent-dec"/></svg></button>
              <button type="button" data-cmd="indent" title="Augmenter le retrait"><svg class="ic"><use href="#i-indent-inc"/></svg></button>
            </div>
            <div class="grp">
              <button type="button" data-act="table" title="Insérer un tableau"><svg class="ic"><use href="#i-table"/></svg></button>
              <button type="button" data-act="pagebreak" title="Saut de page"><svg class="ic"><use href="#i-pagebreak"/></svg></button>
              <button type="button" data-cmd="removeFormat" title="Effacer la mise en forme (Ctrl+\)"><svg class="ic"><use href="#i-clear"/></svg></button>
              <button type="button" data-act="find" title="Rechercher et remplacer (Ctrl+F)"><svg class="ic"><use href="#i-search"/></svg></button>
              <button type="button" data-act="dlp" title="Vérifier les données sensibles"><svg class="ic"><use href="#i-shield"/></svg></button>
            </div>
            <div class="grp" id="tablebar" hidden>
              <button type="button" class="txt" data-tbl="addRow" title="Ajouter une ligne sous la ligne courante">+ ligne</button>
              <button type="button" class="txt" data-tbl="addCol" title="Ajouter une colonne à droite">+ colonne</button>
              <button type="button" class="txt" data-tbl="delRow" title="Supprimer la ligne">− ligne</button>
              <button type="button" class="txt" data-tbl="delCol" title="Supprimer la colonne">− colonne</button>
              <button type="button" class="txt" data-tbl="delTable" title="Supprimer le tableau">Supprimer le tableau</button>
              <button type="button" class="txt" data-tbl="options" title="Bordures, largeur, ligne de titre">Options du tableau</button>
            </div>
          </div>
          <button type="button" id="tb-more" title="Plus d'outils" aria-label="Plus d'outils" hidden><svg class="ic"><use href="#i-more"/></svg></button>
          <button type="button" id="modebtn" title="Mode : édition, suggestion ou lecture seule" aria-haspopup="menu">
            <svg class="ic" id="mode-ic"><use href="#i-edit"/></svg><span id="mode-label">Édition</span><svg class="ic sm"><use href="#i-chev-down"/></svg>
          </button>
        </div>
      </div>

      <div id="workspace">
        <aside id="outline" hidden aria-label="Plan du document">
          <div class="side-head"><b>Plan du document</b><button type="button" class="icon-btn" id="outline-close" title="Fermer le plan" aria-label="Fermer le plan"><svg class="ic"><use href="#i-close"/></svg></button></div>
          <div id="outline-body"></div>
        </aside>

        <div id="canvas">
          <div id="scroller">
            <div id="page" class="sheet" contenteditable="true" spellcheck="false" lang="fr"><p><br></p></div>
          </div>
          <div id="findbar" hidden>
            <input id="find-q" type="text" placeholder="Rechercher" spellcheck="false">
            <input id="find-r" type="text" placeholder="Remplacer par" spellcheck="false">
            <button id="find-prev" title="Précédent">▲</button>
            <button id="find-next" title="Suivant">▼</button>
            <button id="find-rep">Remplacer</button>
            <button id="find-all">Tout remplacer</button>
            <span id="find-count"></span>
            <button id="find-close" title="Fermer">✕</button>
          </div>
        </div>

        <aside id="side" hidden aria-label="Panneau latéral">
          <nav id="sidetabs">
            <div class="seg side-seg">
              <button type="button" data-tab="comments">Commentaires</button>
              <button type="button" data-tab="suggestions">Suggestions</button>
              <button type="button" data-tab="versions">Versions</button>
              <button type="button" data-tab="variables">Variables</button>
            </div>
            <button type="button" class="icon-btn" id="side-close" title="Fermer le panneau" aria-label="Fermer le panneau"><svg class="ic"><use href="#i-close"/></svg></button>
          </nav>
          <div id="sidebody"></div>
        </aside>
      </div>

      <footer id="status">
        <span id="st-count">0 mot</span>
        <span id="st-pages"></span>
        <span id="st-lock"></span>
        <span class="spacer"></span>
        <span id="st-mode"></span>
      </footer>
    </section>
  </main>
</div>

<div id="atmenu" hidden role="listbox"></div>
<div id="selbar" hidden role="toolbar" aria-label="Actions rapides sur la sélection"></div>
<div id="focuspill" hidden><span id="fp-text"></span><button type="button" id="fp-exit" title="Quitter le mode concentration (Échap)">Quitter</button></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="pop"></div>
